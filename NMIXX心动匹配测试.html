const mapping=[['Sullyoon','Jiwoo','Bae','Lily'],['Haewon','Sullyoon','Lily','Bae'],['Jiwoo','Bae','Lily','Sullyoon'],['Haewon','Jiwoo','Lily','Bae'],['Jiwoo','Sullyoon','Bae','Kyujin'],['Haewon','Kyujin','Bae','Lily'],['Haewon','Jiwoo','Lily','Kyujin'],['Sullyoon','Kyujin','Jiwoo','Haewon'],['Sullyoon','Bae','Haewon','Kyujin'],['Kyujin','Haewon','Sullyoon','Lily']];
let answers=Array(10).fill(null),step=0;const app=document.querySelector('#app');
function img(src,name){return `<img src="${src}" alt="${name}" onerror="this.style.display='none';this.parentElement.classList.add('image-missing')">`}
function home(){app.innerHTML=`<section class="view home"><div class="home-copy"><div class="eyebrow">A LITTLE TEST FOR BIG FEELINGS</div><h1>NMIXX<br><span>LOVE MATCH</span></h1><h2>NMIXX 六人心动匹配测试</h2><p class="intro">10道题，找到最容易被你吸引的 NMIXX 成员。如果有机会和六位成员相处，谁会最容易与你产生默契？通过10道日常生活选择题，寻找属于你的专属命定成员。</p><button class="primary start" id="start">开始寻找你的命定成员 ♡</button><div class="hint">10 道问题 · 约 2 分钟 · 即刻开始</div></div><div class="faces">${['Lily','Haewon','Sullyoon','Bae','Jiwoo','Kyujin'].map(k=>`<div class="face">${img(members[k].img,k)}<label>${k}</label></div>`).join('')}</div></section>`;document.querySelector('#start').onclick=()=>{answers=Array(10).fill(null);step=0;quiz()}}
function quiz(){let [title,opts]=questions[step];app.innerHTML=`<section class="view quiz"><div class="meta"><span>心动问答</span><span>${step+1} / 10</span></div><div class="track"><div class="fill" style="width:${(step+1)*10}%"></div></div><div class="qcard"><div class="qnum">QUESTION ${String(step+1).padStart(2,'0')} · ${answers[step]===null?'请选择一个答案':'已选择 '+('ABCD'[answers[step]])}</div><h1 class="question">${title}</h1><div class="choices">${opts.map((s,i)=>`<button class="choice ${answers[step]===i?'on':''}" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${s}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="prev" ${step===0?'disabled':''}>上一步</button><button class="primary" id="next" ${answers[step]===null?'disabled':''}>${step===9?'查看结果':'下一题'}</button></div></div></section>`;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.i;quiz()});document.querySelector('#prev').onclick=()=>{if(step){step--;quiz()}};document.querySelector('#next').onclick=()=>{if(answers[step]===null)return;if(step<9){step++;quiz()}else result()}}
function result(){const scores=Object.fromEntries(Object.keys(members).map(k=>[k,0]));answers.forEach((a,i)=>scores[mapping[i][a]]++);const best=Math.max(...Object.values(scores)),ties=Object.keys(scores).filter(k=>scores[k]===best);const code=answers.reduce((total,choice,index)=>total+choice*(4**index),0);show(ties[code%ties.length],scores)}
function show(key,scores){const m=members[key],stored=JSON.parse(localStorage.getItem('nmixxCounts')||'{}');stored[key]=(stored[key]||0)+1;localStorage.setItem('nmixxCounts',JSON.stringify(stored));app.innerHTML=`<section class="view result theme-${m.theme}"><div class="hero-photo">${img(m.img,m.name)}</div><article class="result-copy"><div class="eyebrow">YOUR NMIXX LOVE MATCH</div><h2>NMIXX 的 ${m.name} 最喜欢你 ♡</h2><div class="sub">${m.subtitle}</div><p>${m.desc}</p><div class="tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="breakdown"><strong>本次得分分布</strong>${Object.keys(members).map(k=>`<div class="scoreline"><span>${k}</span><div class="meter"><i style="width:${scores[k]/10*100}%"></i></div><b>${scores[k]}</b></div>`).join('')}</div><div class="result-actions"><button class="primary" id="image">下载分享图片</button><button class="secondary" id="copy">复制文案</button><button class="secondary" id="share">分享</button><button class="secondary" id="again">重新测试</button></div></article></section>`;document.querySelector('#image').onclick=()=>shareImage(key);document.querySelector('#copy').onclick=()=>copyText(key);document.querySelector('#share').onclick=()=>share(key);document.querySelector('#again').onclick=home}
function textFor(k){return `我测出来的结果是：NMIXX 的 ${k} 最喜欢我 ♡\n\n快来测测 NMIXX 六位成员中，谁最容易被你的性格吸引！\n\nNMIXX LOVE MATCH`}
async function copyText(k){try{await navigator.clipboard.writeText(textFor(k));alert('结果文案已复制')}catch{alert(textFor(k))}}

function shareImage(key){const m=members[key],c=document.createElement('canvas'),x=c.getContext('2d'),im=new Image();c.width=1080;c.height=1350;x.fillStyle='#fff8fb';x.fillRect(0,0,c.width,c.height);x.fillStyle='#f1dce8';x.beginPath();x.arc(1030,50,300,0,Math.PI*2);x.fill();x.fillStyle='#eee7f7';x.beginPath();x.arc(50,1320,260,0,Math.PI*2);x.fill();x.textAlign='center';x.fillStyle='#50394d';x.font='bold 46px Georgia';x.fillText('NMIXX LOVE MATCH',540,85);im.onload=()=>{x.save();x.beginPath();x.roundRect(125,125,830,830,24);x.clip();let sc=Math.max(830/im.width,830/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,125+(830-w)/2,125+(830-h)*.28,w,h);x.restore();x.fillStyle='#342735';x.font='bold 46px Microsoft YaHei,sans-serif';x.fillText(`NMIXX 的 ${key} 最喜欢你 ♡`,540,1035);x.fillStyle='#8c6e86';x.font='29px Microsoft YaHei,sans-serif';x.fillText(m.tags.join(' · '),540,1100);x.font='23px Microsoft YaHei,sans-serif';const words=m.desc.slice(0,80);x.fillText(words,540,1160);x.font='22px Georgia';x.fillText('10 QUESTIONS · ONE HEART MATCH',540,1265);c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`NMIXX-${key}-LOVE-MATCH.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},'image/png')};im.src=m.img}
function stats(){const data=JSON.parse(localStorage.getItem('nmixxCounts')||'{}'),total=Object.values(data).reduce((a,b)=>a+b,0),max=Math.max(1,...Object.values(data));app.innerHTML=`<section class="view stats"><button class="text-btn" id="home">← 返回首页</button><h2>测试结果统计</h2><p>只保存在当前浏览器 · 累计 ${total} 次</p>${Object.keys(members).map(k=>{let n=data[k]||0;return `<div class="stat-row"><b>${k}</b><div class="statbar"><i style="width:${n/max*100}%"></i></div><span class="stat-number">${n} 次 · ${total?(n/total*100).toFixed(1):'0.0'}%</span></div>`}).join('')}<button class="secondary" id="clear">清空本机统计</button></section>`;document.querySelector('#home').onclick=home;document.querySelector('#clear').onclick=()=>{if(confirm('清空本机保存的统计吗？')){localStorage.removeItem('nmixxCounts');stats()}}}
document.querySelector('#statsBtn').onclick=stats;home();
</script></body></html>
